    <script>
      (function() {
        var FINAL_VERSION = 'v34_viewport_360_responsive_guard';
        try {
          localStorage.setItem('kaamzo_admin_treasury_v8', '0');
          localStorage.setItem('kaamzo_admin_sub_rev_v8', '0');
          localStorage.setItem('kaamzo_admin_disbursed_v8', '0');
          localStorage.setItem('kaamzo_admin_txs_v8', '[]');
          localStorage.removeItem('kaamzo_google_accounts_v1');

          // Clean up any previous generic "Google User" / "user@kaamzo.in" fallback session
          ['kaamzo_current_customer_v8', 'kaamzo_current_worker_v8'].forEach(function(key) {
            var val = localStorage.getItem(key);
            if (val && (val.includes('user@kaamzo.in') || val.includes('Google User'))) {
              localStorage.removeItem(key);
            }
          });
          ['kaamzo_customer_accounts_v8', 'kaamzo_worker_accounts_v8'].forEach(function(key) {
            var raw = localStorage.getItem(key);
            if (raw && (raw.includes('user@kaamzo.in') || raw.includes('Google User'))) {
              try {
                var arr = JSON.parse(raw);
                if (Array.isArray(arr)) {
                  var filtered = arr.filter(function(u) {
                    return u && u.id !== 'user@kaamzo.in' && u.email !== 'user@kaamzo.in' && u.name !== 'Google User';
                  });
                  localStorage.setItem(key, JSON.stringify(filtered));
                }
              } catch (_) {}
            }
          });

          if (localStorage.getItem('kaamzo_final_version') !== FINAL_VERSION) {
            localStorage.removeItem('kaamzo_is_reset_state_v8');
            localStorage.removeItem('kaamzo_current_admin_v8');
            sessionStorage.clear();
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            localStorage.setItem('kaamzo_final_version', FINAL_VERSION);
          }
        } catch (e) {
          console.warn('Finalize cache sync note:', e);
        }
      })();
    </script>
    <style>
      /* Root Responsive & Anti-Overflow Guard for 360px+ Screens */
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: rgba(245, 158, 11, 0.15);
      }
      body {
        font-size: 16px;
        min-height: 100vh;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        line-height: 1.5;
      }
      #root, main, #main-content {
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }

      /* Kaamzo Customer & Worker Portal Aesthetic & Click-Friendly Polish */
      button, [role="button"], a, select, input[type="checkbox"], input[type="range"] {
        cursor: pointer;
        touch-action: manipulation;
      }
      button:not(:disabled) {
        transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, background-color 0.18s ease, border-color 0.18s ease;
      }
      button:not(:disabled):active {
        transform: scale(0.97);
      }
      input:not([type="checkbox"]):not([type="range"]), select, textarea {
        font-size: 16px !important;
        max-width: 100%;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
      }
      input:not([type="checkbox"]):not([type="range"]):focus, select:focus, textarea:focus {
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.22);
      }
      input::placeholder {
        text-overflow: ellipsis;
        overflow: hidden;
      }

      /* Prevent text overflow and ensure flexible wrapping */
      p, span, h1, h2, h3, h4, h5, h6, a, div, button {
        overflow-wrap: break-word;
      }
      img, svg, video, canvas, iframe {
        max-width: 100%;
        height: auto;
      }

      /* Black / Dark Theme Header & Portal Navbar Suitable Obsidian-Gold Palette */
      html.dark header,
      html.dark #kaamzo-global-header {
        background: linear-gradient(90deg, #0b0d12 0%, #11141d 55%, #1c1508 100%) !important;
        border-bottom: 1px solid rgba(245, 158, 11, 0.32) !important;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.72), inset 0 -1px 0 rgba(245, 158, 11, 0.14) !important;
      }
      html.dark nav,
      html.dark #kaamzo-customer-navbar {
        background: linear-gradient(180deg, #12151e 0%, #0d0f16 100%) !important;
        border-bottom: 1px solid rgba(245, 158, 11, 0.26) !important;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55) !important;
      }
      html.dark #kaamzo-customer-tabs {
        background-color: #08090d !important;
        border-color: rgba(245, 158, 11, 0.26) !important;
      }
      html.dark .bg-\[\#FAF7F2\],
      html.dark .bg-\[\#FAF7F2\]\/95,
      html.dark .bg-\[\#FDFBF7\] {
        background-color: #0e1017 !important;
      }
      html.dark .bg-\[\#FFFBEB\] {
        background-color: rgba(245, 158, 11, 0.16) !important;
        color: #fcd33f !important;
        border-color: rgba(245, 158, 11, 0.45) !important;
      }
      html.dark header button:not(.bg-amber-500),
      html.dark #kaamzo-global-header > div > button {
        border-color: rgba(245, 158, 11, 0.25) !important;
      }

      /* Pinterest-Grade Asymmetric Bento Customer Hero Layout (Guaranteed CSS Grid) */
      #kaamzo-customer-hero {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 24px;
        background: radial-gradient(circle at 88% 18%, rgba(245, 158, 11, 0.16) 0%, transparent 45%),
                    linear-gradient(135deg, #0b0d13 0%, #111520 55%, #19140b 100%);
        border: 1px solid rgba(245, 158, 11, 0.28);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        align-items: center;
        max-width: 100%;
        overflow: hidden;
      }
      @media (min-width: 960px) {
        #kaamzo-customer-hero {
          grid-template-columns: 1.15fr 0.95fr;
          gap: 36px;
          padding: 36px 40px;
        }
      }
      .kaamzo-bento-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        width: 100%;
      }
      .kaamzo-bento-card {
        position: relative;
        height: 148px;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14);
        cursor: pointer;
        text-align: left;
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, box-shadow 0.22s ease;
      }
      .kaamzo-bento-card:hover {
        transform: translateY(-3px);
        border-color: rgba(252, 211, 63, 0.75);
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      }
      .kaamzo-bento-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.4s ease;
      }
      .kaamzo-bento-card:hover img {
        transform: scale(1.06);
      }

      /* 360px Android & Mobile Screen Refinements */
      @media (max-width: 480px) {
        #kaamzo-customer-hero {
          padding: 16px 12px !important;
          gap: 16px !important;
          border-radius: 20px !important;
          max-width: 100% !important;
        }
        .kaamzo-bento-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
          gap: 8px !important;
          width: 100% !important;
        }
        .kaamzo-bento-card {
          height: 128px !important;
          border-radius: 14px !important;
        }
        #hero-post-job-btn,
        #kaamzo-customer-hero button.bg-gradient-to-r,
        #kaamzo-customer-hero button[title*="Broadcast a new job"],
        #kaamzo-customer-hero button[title*="Scan worker unique ID"] {
          width: 100% !important;
          justify-content: center !important;
        }
        #kaamzo-global-header, #kaamzo-customer-navbar {
          padding-left: 8px !important;
          padding-right: 8px !important;
          max-width: 100vw !important;
        }
        .fixed.inset-0 > div {
          max-width: calc(100vw - 16px) !important;
          margin: 8px auto !important;
        }
      }

    <script type="text/javascript">
      (function() {
        window.kaamzoShowOtpBanner = function() {};

        // Enterprise Admin Security & Audit Vault
        window.kaamzoAdminSecurity = {
          // Admin credentials, whitelist and PIN live ONLY on the server (see admin-security.js).
          // These stubs intentionally verify nothing client-side.
          getWhitelist: function() { return []; },
          isAuthorizedEmail: function() { return false; },
          verifyPassword: function() { return false; },
          setMasterPassword: function() { return false; },
          verifyPin: function() { return false; },
          setSecurityPin: function() { return false; },
          getAuditLogs: function() {
            try {
              const raw = localStorage.getItem("kaamzo_admin_audit_logs_v1");
              if (raw) return JSON.parse(raw);
            } catch (e) {}
            return [
              {
                id: "sec-boot-1",
                timestamp: new Date().toLocaleTimeString(),
                event: "PLATFORM_OPERATIONS_ACTIVE",
                actor: "system@kaamzo.site",
                severity: "VERIFIED",
                details: "Kaamzo Operations & Admin Console active. Real-time platform management enabled."
              }
            ];
          },
          logEvent: function(event, details, severity, actor) {
            try {
              const logs = this.getAuditLogs();
              const entry = {
                id: "sec-" + Date.now(),
                timestamp: new Date().toLocaleTimeString(),
                event: event || "SECURITY_EVENT",
                actor: actor || "bhavnoorsinghkochar@gmail.com",
                severity: severity || "INFO",
                details: details || ""
              };
              logs.unshift(entry);
              localStorage.setItem("kaamzo_admin_audit_logs_v1", JSON.stringify(logs.slice(0, 60)));
            } catch (e) {}
          }
        };
      })();
