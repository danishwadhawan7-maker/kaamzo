    <script>
      (function() {
        var FINAL_VERSION = 'v36_audio_reader_active';
        try {
          localStorage.setItem('kaamzo_admin_treasury_v8', '0');
          localStorage.setItem('kaamzo_admin_sub_rev_v8', '0');
          localStorage.setItem('kaamzo_admin_disbursed_v8', '0');
          localStorage.setItem('kaamzo_admin_txs_v8', '[]');
          localStorage.removeItem('kaamzo_google_accounts_v1');

          // Clean up any previous generic "Google User" / "user@kaamzo.in" fallback session
          ['kaamzo_current_customer_v8', 'kaamzo_current_worker_v8'].forEach(function(key) {
            var val = localStorage.getItem(key);
            if (val && (val.includes('user@kaamzo.in') || val.includes('Google User'))) {
              localStorage.removeItem(key);
            }
          });
          ['kaamzo_customer_accounts_v8', 'kaamzo_worker_accounts_v8'].forEach(function(key) {
            var raw = localStorage.getItem(key);
            if (raw && (raw.includes('user@kaamzo.in') || raw.includes('Google User'))) {
              try {
                var arr = JSON.parse(raw);
                if (Array.isArray(arr)) {
                  var filtered = arr.filter(function(u) {
                    return u && u.id !== 'user@kaamzo.in' && u.email !== 'user@kaamzo.in' && u.name !== 'Google User';
                  });
                  localStorage.setItem(key, JSON.stringify(filtered));
                }
              } catch (_) {}
            }
          });

          if (localStorage.getItem('kaamzo_final_version') !== FINAL_VERSION) {
            localStorage.removeItem('kaamzo_is_reset_state_v8');
            localStorage.removeItem('kaamzo_current_admin_v8');
            sessionStorage.clear();
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            localStorage.setItem('kaamzo_final_version', FINAL_VERSION);
          }
        } catch (e) {
          console.warn('Finalize cache sync note:', e);
        }
      })();
    </script>

    <script type="text/javascript">
      (function() {
        var isAudioMode = false;
        var activeAudio = null;
        var activeWordSpan = null;
        var wordInterval = null;

        function detectLanguage(text) {
          if (!text) return 'en';
          if (/[\u0A00-\u0A7F]/.test(text)) return 'pa'; // Punjabi (Gurmukhi)
          if (/[\u0900-\u097F]/.test(text)) return 'hi'; // Hindi (Devanagari)
          try {
            var appLang = localStorage.getItem('kaamzo_language_v8') || 'en';
            if (appLang === 'pa' || appLang === 'hi') return appLang;
          } catch(e) {}
          return 'en';
        }

        function clearSpokenHighlightOnly() {
          if (activeWordSpan) {
            activeWordSpan.classList.remove('kaamzo-spoken-word-active');
            activeWordSpan = null;
          }
          var spoken = document.querySelectorAll('.kaamzo-spoken-word-active');
          for (var i = 0; i < spoken.length; i++) {
            spoken[i].classList.remove('kaamzo-spoken-word-active');
          }
        }

        function clearActiveSpokenWord() {
          clearSpokenHighlightOnly();
          if (wordInterval) {
            clearInterval(wordInterval);
            wordInterval = null;
          }
        }

        function stopAudio() {
          if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch(e) {}
          }
          if (activeAudio) {
            try {
              activeAudio.pause();
              activeAudio.currentTime = 0;
            } catch(e) {}
            activeAudio = null;
          }
          clearActiveSpokenWord();
          var statusEl = document.getElementById('kaamzo-audio-status');
          if (statusEl) statusEl.textContent = 'Click any text/word to listen';
        }

        window.kaamzoStopAudio = stopAudio;

        function toggleAudioReader(forceState) {
          if (typeof forceState === 'boolean') {
            isAudioMode = forceState;
          } else {
            isAudioMode = !isAudioMode;
          }

          var toolbar = document.getElementById('kaamzo-audio-toolbar');
          var headerBtns = document.querySelectorAll('.kaamzo-header-audio-btn, #kaamzo-header-audio-btn, #kaamzo-header-audio-btn-sec');

          if (isAudioMode) {
            document.body.classList.add('kaamzo-audio-active');
            if (toolbar) toolbar.classList.add('visible');
            for (var b = 0; b < headerBtns.length; b++) {
              headerBtns[b].classList.add('kaamzo-header-audio-active');
            }
            var statusEl = document.getElementById('kaamzo-audio-status');
            if (statusEl) statusEl.textContent = 'Orange: highlighted text • Click to speak (turns blue)';
          } else {
            stopAudio();
            document.body.classList.remove('kaamzo-audio-active');
            if (toolbar) toolbar.classList.remove('visible');
            for (var b = 0; b < headerBtns.length; b++) {
              headerBtns[b].classList.remove('kaamzo-header-audio-active');
            }
          }
        }

        window.kaamzoToggleAudioReader = toggleAudioReader;

        // Speak a specific target element or word
        function handleElementSpeak(element, clickedNode) {
          if (!isAudioMode) return;
          stopAudio();

          var rawText = (element.innerText || element.textContent || '').trim();
          if (!rawText || rawText.length === 0) return;

          var lang = detectLanguage(rawText);
          var langName = lang === 'pa' ? 'Punjabi' : lang === 'hi' ? 'Hindi' : 'English';
          var statusEl = document.getElementById('kaamzo-audio-status');
          if (statusEl) {
            statusEl.textContent = 'Speaking (' + langName + '): ' + rawText.substring(0, 30) + '...';
          }

          // Wrap individual words across all text nodes if not already wrapped
          if (!element.classList.contains('kaamzo-word') && !element.querySelector('.kaamzo-word')) {
            try {
              var walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
              var textNodes = [];
              var tn;
              while ((tn = walker.nextNode())) {
                if (tn.nodeValue && tn.nodeValue.trim().length > 0 && !(tn.parentElement && tn.parentElement.classList.contains('kaamzo-word'))) {
                  textNodes.push(tn);
                }
              }
              for (var nIdx = 0; nIdx < textNodes.length; nIdx++) {
                var node = textNodes[nIdx];
                var frag = document.createDocumentFragment();
                var parts = node.nodeValue.split(/(\s+)/);
                for (var p = 0; p < parts.length; p++) {
                  if (!parts[p]) continue;
                  if (/^\s+$/.test(parts[p])) {
                    frag.appendChild(document.createTextNode(parts[p]));
                  } else {
                    var wSpan = document.createElement('span');
                    wSpan.className = 'kaamzo-word';
                    wSpan.textContent = parts[p];
                    frag.appendChild(wSpan);
                  }
                }
                if (node.parentNode) node.parentNode.replaceChild(frag, node);
              }
            } catch (err) {}
          }

          var wordSpans = element.classList.contains('kaamzo-word') ? [element] : element.querySelectorAll('.kaamzo-word');

          // Highlight the clicked/first word immediately in Cobalt Blue while others remain Orange
          var startIdx = 0;
          var targetSpan = null;
          if (clickedNode && clickedNode.classList && clickedNode.classList.contains('kaamzo-word')) {
            targetSpan = clickedNode;
            for (var si = 0; si < wordSpans.length; si++) {
              if (wordSpans[si] === clickedNode) { startIdx = si; break; }
            }
          } else if (wordSpans.length > 0) {
            targetSpan = wordSpans[0];
          }

          if (targetSpan) {
            clearActiveSpokenWord();
            targetSpan.classList.add('kaamzo-spoken-word-active');
            activeWordSpan = targetSpan;
          }

          // Use Web Speech API if supported
          if ('speechSynthesis' in window) {
            try {
              var utterance = new SpeechSynthesisUtterance(rawText);
              utterance.rate = 0.92;
              utterance.pitch = 1.0;

              var voices = window.speechSynthesis.getVoices();
              var matchedVoice = null;
              if (lang === 'pa') {
                matchedVoice = voices.find(function(v) { return v.lang.startsWith('pa') || v.name.toLowerCase().includes('punjabi'); });
                utterance.lang = 'pa-IN';
              } else if (lang === 'hi') {
                matchedVoice = voices.find(function(v) { return v.lang.startsWith('hi') || v.name.toLowerCase().includes('hindi'); });
                utterance.lang = 'hi-IN';
              } else {
                matchedVoice = voices.find(function(v) { return v.lang.startsWith('en-IN') || v.lang.startsWith('en'); });
                utterance.lang = 'en-IN';
              }
              if (matchedVoice) utterance.voice = matchedVoice;

              var boundaryFired = false;
              if (wordSpans && wordSpans.length > 1) {
                var fIdx = startIdx;
                wordInterval = setInterval(function() {
                  if (boundaryFired || fIdx >= wordSpans.length - 1) {
                    if (boundaryFired && wordInterval) { clearInterval(wordInterval); wordInterval = null; }
                    return;
                  }
                  fIdx++;
                  clearSpokenHighlightOnly();
                  if (wordSpans[fIdx]) {
                    wordSpans[fIdx].classList.add('kaamzo-spoken-word-active');
                    activeWordSpan = wordSpans[fIdx];
                  }
                }, 380);
              }

              utterance.onboundary = function(event) {
                if (event.name === 'word' && wordSpans.length > 0) {
                  boundaryFired = true;
                  if (wordInterval) { clearInterval(wordInterval); wordInterval = null; }
                  var charIndex = event.charIndex;
                  var accumulated = 0;
                  for (var i = 0; i < wordSpans.length; i++) {
                    var sLen = wordSpans[i].textContent.length;
                    if (charIndex >= accumulated && charIndex < accumulated + sLen + 2) {
                      clearSpokenHighlightOnly();
                      wordSpans[i].classList.add('kaamzo-spoken-word-active');
                      activeWordSpan = wordSpans[i];
                      break;
                    }
                    accumulated += sLen + 1;
                  }
                }
              };

              utterance.onend = function() {
                clearActiveSpokenWord();
                if (statusEl) statusEl.textContent = 'Finished. Click any text/word to listen';
              };

              utterance.onerror = function() {
                fallbackGoogleTTS(rawText, lang, wordSpans);
              };

              window.speechSynthesis.speak(utterance);
              return;
            } catch(e) {
              console.warn('SpeechSynthesis error, falling back:', e);
            }
          }

          fallbackGoogleTTS(rawText, lang, wordSpans);
        }

        function fallbackGoogleTTS(text, lang, wordSpans) {
          try {
            var safeText = encodeURIComponent(text.substring(0, 180));
            var audioUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=' + lang + '&client=tw-ob&q=' + safeText;
            activeAudio = new Audio(audioUrl);
            activeAudio.play().catch(function(e) { console.warn('Audio play notice:', e); });

            if (wordSpans && wordSpans.length > 0) {
              var currentIdx = 0;
              wordInterval = setInterval(function() {
                if (!activeAudio || activeAudio.paused || currentIdx >= wordSpans.length) {
                  clearInterval(wordInterval);
                  return;
                }
                clearSpokenHighlightOnly();
                if (wordSpans[currentIdx]) {
                  wordSpans[currentIdx].classList.add('kaamzo-spoken-word-active');
                  activeWordSpan = wordSpans[currentIdx];
                }
                currentIdx++;
              }, 400);

              activeAudio.onended = function() {
                clearActiveSpokenWord();
                var statusEl = document.getElementById('kaamzo-audio-status');
                if (statusEl) statusEl.textContent = 'Finished. Click any text/word to listen';
              };
            }
          } catch(e) {
            console.error('Fallback TTS failed:', e);
          }
        }

        // Global Event Delegation for clicking any highlighted text in Audio Mode
        window.addEventListener('click', function(ev) {
          if (!isAudioMode) return;
          var target = ev.target;
          if (!target) return;

          // Ignore clicks on audio toolbar controls or header audio toggle buttons
          if (target.closest && target.closest('.kaamzo-ui-ignore, .kaamzo-header-audio-btn, #kaamzo-header-audio-btn, #kaamzo-header-audio-btn-sec')) return;

          // Prevent navigation when in audio reading mode
          ev.preventDefault();
          ev.stopPropagation();

          var readableParent = target.closest('p, h1, h2, h3, h4, h5, h6, label, a, button, li');
          if (!readableParent) readableParent = target.closest('span:not(.kaamzo-word)');
          if (readableParent) {
            handleElementSpeak(readableParent, target);
          } else {
            handleElementSpeak(target, target);
          }
        }, true);
      })();
    </script>
