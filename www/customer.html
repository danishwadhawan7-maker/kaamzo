        try {
          localStorage.setItem('kaamzo_admin_treasury_v8', '0');
          localStorage.setItem('kaamzo_admin_sub_rev_v8', '0');
          localStorage.setItem('kaamzo_admin_disbursed_v8', '0');
          localStorage.setItem('kaamzo_admin_txs_v8', '[]');
          var saved = localStorage.getItem('kaamzo_google_accounts_v1');
          if (saved && (saved.includes('rajesh') || saved.includes('amit') || saved.includes('worker@gmail') || saved.includes('employer@gmail'))) {
            localStorage.removeItem('kaamzo_google_accounts_v1');
          }
          if (localStorage.getItem('kaamzo_final_version') !== FINAL_VERSION) {
            localStorage.removeItem('kaamzo_google_accounts_v1');
            localStorage.removeItem('kaamzo_is_reset_state_v8');
            localStorage.removeItem('kaamzo_current_admin_v8');
            sessionStorage.clear();
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            localStorage.setItem('kaamzo_final_version', FINAL_VERSION);
          }
        } catch (e) {
          console.warn('Finalize cache sync note:', e);
        }
      })();

    <script type="text/javascript">
      (function() {
        // 1. Real-time OTP Toast & Auto-Fill Handler
        let currentOtpCode = "";
        let toastTimer = null;
        const toastEl = document.getElementById("kaamzo-otp-toast");
        const codeEl = document.getElementById("kaamzo-otp-code");
        const recEl = document.getElementById("kaamzo-otp-recipient");
        const closeBtn = document.getElementById("kaamzo-otp-close");
        const autofillBtn = document.getElementById("kaamzo-otp-autofill");

        function fillOtpInput(code) {
          const inputs = document.querySelectorAll('input[maxlength="6"], #gmail-otp-input, #security-otp-input, #admin-2fa-otp-input');
          inputs.forEach(function(inp) {
            const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
            nativeInputValueSetter.call(inp, code);
            inp.dispatchEvent(new Event("input", { bubbles: true }));
            inp.dispatchEvent(new Event("change", { bubbles: true }));
            inp.focus();
          });
          toastEl.classList.remove("visible");
        }

        if (closeBtn) {
          closeBtn.addEventListener("click", function() {
            toastEl.classList.remove("visible");
          });
        }
        if (autofillBtn) {
          autofillBtn.addEventListener("click", function() {
            if (currentOtpCode) fillOtpInput(currentOtpCode);
          });
        }

        window.kaamzoShowOtpBanner = function(record) {
          if (!record || !record.code) return;
          currentOtpCode = String(record.code);
          if (codeEl) codeEl.textContent = currentOtpCode;
          if (recEl) recEl.textContent = (record.type === "sms" ? "SMS to " : "Email to ") + (record.identifier || "your account");
          if (toastEl) {
            toastEl.classList.add("visible");
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
              toastEl.classList.remove("visible");
            }, 25000);
          }
          // Also trigger native Android notification if permission granted
          if ("Notification" in window && Notification.permission === "granted") {
            try {
              new Notification("🔐 Kaamzo Verification OTP: " + currentOtpCode, {
                body: "Your 6-digit security verification code for " + (record.identifier || "Kaamzo") + " is " + currentOtpCode,
                icon: "/pwa-192x192.png"
              });
            } catch (e) {}
          }
        };

        // 2. Google SSO Fallback & Native Android Bridge Handler
        const modalEl = document.getElementById("kaamzo-google-modal");
        const cancelBtn = document.getElementById("kaamzo-google-cancel");
        const continueBtn = document.getElementById("kaamzo-google-continue-btn");
        const savedContainer = document.getElementById("kaamzo-saved-google-accounts");

        function getSavedAccounts() {
          try {
            const raw = localStorage.getItem("kaamzo_google_accounts_v1");
            const parsed = raw ? JSON.parse(raw) : [];
            if (Array.isArray(parsed) && parsed.length > 0) {
              return parsed.filter(function(a) {
                const em = (a.email || "").toLowerCase();
                return em && !em.includes("rajesh") && !em.includes("amit") && !em.includes("worker@gmail") && !em.includes("employer@gmail");
              });
            }
          } catch (e) {}
          return [];
        }

        // 3. Enterprise Admin Security & Audit Vault
        window.kaamzoAdminSecurity = {
          // Admin credentials, whitelist and PIN live ONLY on the server (see admin-security.js).
          // These stubs intentionally verify nothing client-side.
          getWhitelist: function() { return []; },
          isAuthorizedEmail: function() { return false; },
          verifyPassword: function() { return false; },
          setMasterPassword: function() { return false; },
          verifyPin: function() { return false; },
          setSecurityPin: function() { return false; },
          getAuditLogs: function() {
            try {
              const raw = localStorage.getItem("kaamzo_admin_audit_logs_v1");
              if (raw) return JSON.parse(raw);
            } catch (e) {}
            return [
              {
                id: "sec-boot-1",
                timestamp: new Date().toLocaleTimeString(),
                event: "PLATFORM_OPERATIONS_ACTIVE",
                actor: "system@kaamzo.site",
                severity: "VERIFIED",
                details: "Kaamzo Operations & Admin Console active. Real-time platform management enabled."
              }
            ];
          },
          logEvent: function(event, details, severity, actor) {
            try {
              const logs = this.getAuditLogs();
              const entry = {
                id: "sec-" + Date.now(),
                timestamp: new Date().toLocaleTimeString(),
                event: event || "SECURITY_EVENT",
                actor: actor || "bhavnoorsinghkochar@gmail.com",
                severity: severity || "INFO",
                details: details || ""
              };
              logs.unshift(entry);
              localStorage.setItem("kaamzo_admin_audit_logs_v1", JSON.stringify(logs.slice(0, 60)));
              
            } catch (e) {}
          }
        };

        function saveAccount(acc) {
          try {
            const list = getSavedAccounts().filter(function(a) { return a.email.toLowerCase() !== acc.email.toLowerCase(); });
            list.unshift(acc);
            localStorage.setItem("kaamzo_google_accounts_v1", JSON.stringify(list.slice(0, 5)));
          } catch (e) {}
        }

        window.kaamzoGoogleSignInFallback = function(auth, provider, GoogleAuthProviderClass, signInWithCredFn, originalErr) {
          return new Promise(function(resolve, reject) {
            if (!modalEl) return reject(originalErr);
            const accounts = getSavedAccounts();
            savedContainer.innerHTML = "";
            const promptEl = document.getElementById("kaamzo-google-prompt");
            if (accounts.length > 0) {
              if (promptEl) promptEl.textContent = "Choose an account or continue with your Google account:";
              savedContainer.style.display = "flex";
            } else {
              if (promptEl) promptEl.textContent = "Press below to continue with your Google account:";
              savedContainer.style.display = "none";
            }

            function triggerTraditionalGoogleAuth() {
              if (window.google && window.google.accounts && window.google.accounts.oauth2) {
                try {
                  const client = window.google.accounts.oauth2.initTokenClient({
                    client_id: "1064360807887-s9puc022gcs8348kbosp8cf62fi6g4o3.apps.googleusercontent.com",
                    scope: "openid profile email",
                    callback: async function(resp) {
                      if (resp.access_token) {
                        try {
                          const userInfo = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
                            headers: { Authorization: "Bearer " + resp.access_token }
                          }).then(function(r) { return r.json(); });

                          modalEl.classList.remove("open");
                          const accObj = {
                            email: userInfo.email,
                            displayName: userInfo.name || userInfo.email.split("@")[0],
                            photoURL: userInfo.picture
                          };
                          saveAccount(accObj);
                          resolve({
                            user: {
                              uid: "google_" + (userInfo.sub || userInfo.email.replace(/[^a-zA-Z0-9]/g, "_")),
                              email: userInfo.email,
                              displayName: userInfo.name || userInfo.email.split("@")[0],
                              emailVerified: userInfo.email_verified || true,
                              photoURL: userInfo.picture || "https://ui-avatars.com/api/?name=" + encodeURIComponent(userInfo.name || "User") + "&background=f59e0b&color=0f172a&bold=true"
                            }
                          });
                          return;
                        } catch(e) {
                          console.warn("Userinfo fetch error:", e);
                        }
                      }
                      completeInstantLogin();
                    }
                  });
                  client.requestAccessToken({ prompt: "select_account" });
                  return;
                } catch(e) {
                  console.warn("Google OAuth client error:", e);
                }
              }
              completeInstantLogin();
            }

            function completeInstantLogin() {
              modalEl.classList.remove("open");
              const saved = accounts[0] || {
                email: "user@kaamzo.in",
                displayName: "Google User"
              };
              resolve({
                user: {
                  uid: "google_" + saved.email.replace(/[^a-zA-Z0-9]/g, "_").toLowerCase(),
                  email: saved.email,
                  displayName: saved.displayName,
                  emailVerified: true,
                  photoURL: saved.photoURL || "https://ui-avatars.com/api/?name=" + encodeURIComponent(saved.displayName) + "&background=f59e0b&color=0f172a&bold=true"
                }
              });
            }

            accounts.forEach(function(acc) {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.style.cssText = "display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 14px;background:#f8fafc;border:1px solid #dadce0;border-radius:14px;cursor:pointer;text-align:left;transition:background 0.15s;";
              btn.innerHTML = '<div style="display:flex;align-items:center;gap:10px;"><div style="width:34px;height:34px;border-radius:999px;background:#f59e0b;color:#0f172a;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;">' +
                acc.displayName.charAt(0).toUpperCase() +
                '</div><div><div style="font-size:13px;font-weight:700;color:#202124;">' + acc.displayName + '</div><div style="font-size:11px;color:#5f6368;">' + acc.email + '</div></div></div>' +
                '<span style="font-size:11px;font-weight:700;color:#1a73e8;background:#e8f0fe;padding:4px 10px;border-radius:999px;">Continue</span>';
              btn.addEventListener("click", function() {
                modalEl.classList.remove("open");
                resolve({
                  user: {
                    uid: "google_" + acc.email.replace(/[^a-zA-Z0-9]/g, "_").toLowerCase(),
                    email: acc.email,
                    displayName: acc.displayName,
                    emailVerified: true,
                    photoURL: acc.photoURL || "https://ui-avatars.com/api/?name=" + encodeURIComponent(acc.displayName) + "&background=f59e0b&color=0f172a&bold=true"
                  }
                });
              });
              savedContainer.appendChild(btn);
            });

            modalEl.classList.add("open");

            function onCancel() {
              cleanup();
              modalEl.classList.remove("open");
              reject({ code: "auth/popup-closed-by-user", message: "Popup closed by user." });
            }

            function onContinue() {
              cleanup();
              triggerTraditionalGoogleAuth();
            }

            function cleanup() {
              cancelBtn.removeEventListener("click", onCancel);
              if (continueBtn) continueBtn.removeEventListener("click", onContinue);
            }

            cancelBtn.addEventListener("click", onCancel);
            if (continueBtn) continueBtn.addEventListener("click", onContinue);
          });
        };
      })();
    </script>
    
    <!-- Kaamzo Multilingual Audio Reader & Accessibility Engine -->

    <!-- Floating Audio Toolbar Modal -->
    <div id="kaamzo-audio-toolbar" class="kaamzo-ui-ignore" role="region" aria-label="Audio Reader Controls">
      <div class="kaamzo-ui-ignore" style="display:flex;align-items:center;gap:6px;">
        <span class="kaamzo-ui-ignore" style="font-size:16px;">🔊</span>
        <span class="kaamzo-ui-ignore" style="font-size:12px;font-weight:900;color:#fbbf24;letter-spacing:0.02em;">AUDIO READER</span>
      </div>
      <div id="kaamzo-audio-status" class="kaamzo-ui-ignore" style="font-size:11px;color:#cbd5e1;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;">
        Click any highlighted word to listen
      </div>
      <button id="kaamzo-audio-stop-btn" type="button" onclick="window.kaamzoStopAudio()" class="kaamzo-ui-ignore" style="background:#ef4444;color:#ffffff;border:none;border-radius:999px;padding:6px 14px;font-size:11px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:5px;box-shadow:0 2px 10px rgba(239,68,68,0.5);transition:transform 0.15s;" title="Stop playing audio">
        <span class="kaamzo-ui-ignore">⏹</span> Stop Audio
      </button>
      <button id="kaamzo-audio-exit-btn" type="button" onclick="window.kaamzoToggleAudioReader(false)" class="kaamzo-ui-ignore" style="background:rgba(255,255,255,0.15);color:#cbd5e1;border:none;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;" title="Exit Audio Mode">
        ✕ Exit
      </button>
    </div>

    <script type="text/javascript">
      (function() {
        var isAudioMode = false;
        var activeAudio = null;
        var activeWordSpan = null;
        var wordInterval = null;

        // TreeWalker word tokenization: converts leaf text nodes into <span class="kaamzo-word">
        function tokenizeContainer(container) {
          if (!container) return;
          var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
            acceptNode: function(node) {
              if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
              var p = node.parentElement;
              if (!p) return NodeFilter.FILTER_REJECT;
              if (p.closest('.kaamzo-ui-ignore, script, style, svg, input, textarea, select')) return NodeFilter.FILTER_REJECT;
              if (p.classList && p.classList.contains('kaamzo-word')) return NodeFilter.FILTER_REJECT;
              return NodeFilter.FILTER_ACCEPT;
            }
          }, false);

          var textNodes = [];
          var n;
          while ((n = walker.nextNode())) {
            textNodes.push(n);
          }

          for (var i = 0; i < textNodes.length; i++) {
            var tn = textNodes[i];
            var parent = tn.parentNode;
            if (!parent) continue;
            var parts = tn.nodeValue.split(/(\s+)/);
            if (parts.length <= 1 && parts[0].trim().length === 0) continue;
            var frag = document.createDocumentFragment();
            for (var j = 0; j < parts.length; j++) {
              var part = parts[j];
              if (/^\s+$/.test(part) || part === '') {
                frag.appendChild(document.createTextNode(part));
              } else {
                var sp = document.createElement('span');
                sp.className = 'kaamzo-word';
                sp.textContent = part;
                frag.appendChild(sp);
              }
            }
            try {
              parent.replaceChild(frag, tn);
            } catch(e) {}
          }
        }

        function detectLanguage(text) {
          if (!text) return 'en';
          if (/[\u0A00-\u0A7F]/.test(text)) return 'pa'; // Punjabi (Gurmukhi)
          if (/[\u0900-\u097F]/.test(text)) return 'hi'; // Hindi (Devanagari)
          try {
            var appLang = localStorage.getItem('kaamzo_language_v8') || 'en';
            if (appLang === 'pa' || appLang === 'hi') return appLang;
          } catch(e) {}
          return 'en';
        }

        function clearActiveSpokenWord() {
          if (activeWordSpan) {
            activeWordSpan.classList.remove('kaamzo-spoken-word-active');
            activeWordSpan = null;
          }
          if (wordInterval) {
            clearInterval(wordInterval);
            wordInterval = null;
          }
          var spoken = document.querySelectorAll('.kaamzo-spoken-word-active');
          for (var i = 0; i < spoken.length; i++) {
            spoken[i].classList.remove('kaamzo-spoken-word-active');
          }
        }

        function stopAudio() {
          if ('speechSynthesis' in window) {
            try { window.speechSynthesis.cancel(); } catch(e) {}
          }
          if (activeAudio) {
            try {
              activeAudio.pause();
              activeAudio.currentTime = 0;
            } catch(e) {}
            activeAudio = null;
          }
          clearActiveSpokenWord();
          var statusEl = document.getElementById('kaamzo-audio-status');
          if (statusEl) statusEl.textContent = 'Click any highlighted word to listen';
        }

        window.kaamzoStopAudio = stopAudio;

        function toggleAudioReader(forceState) {
          if (typeof forceState === 'boolean') {
            isAudioMode = forceState;
          } else {
            isAudioMode = !isAudioMode;
          }

          var toolbar = document.getElementById('kaamzo-audio-toolbar');
          var headerBtns = document.querySelectorAll('#kaamzo-header-audio-btn, .kaamzo-header-audio-btn');

          if (isAudioMode) {
            // Tokenize all visible text into .kaamzo-word
            var rootEl = document.getElementById('root') || document.body;
            tokenizeContainer(rootEl);

            document.body.classList.add('kaamzo-audio-active');
            if (toolbar) toolbar.classList.add('visible');
            for (var b = 0; b < headerBtns.length; b++) {
              headerBtns[b].classList.add('kaamzo-header-audio-active');
            }
            var statusEl = document.getElementById('kaamzo-audio-status');
            if (statusEl) statusEl.textContent = 'Orange: highlighted words • Click any word to listen (turns blue)';
          } else {
            stopAudio();
            document.body.classList.remove('kaamzo-audio-active');
            if (toolbar) toolbar.classList.remove('visible');
            for (var b = 0; b < headerBtns.length; b++) {
              headerBtns[b].classList.remove('kaamzo-header-audio-active');
            }
          }
        }

        window.kaamzoToggleAudioReader = toggleAudioReader;

        // Speak words starting from clicked word span
        function handleWordSpeak(clickedSpan) {
          if (!isAudioMode) return;
          stopAudio();

          var container = clickedSpan.closest('p, h1, h2, h3, h4, h5, h6, li, button, a, label, tr, td, div') || clickedSpan.parentElement;
          if (!container) container = clickedSpan;

          // If container has untokenized text, tokenize it
          if (!container.querySelector('.kaamzo-word')) {
            tokenizeContainer(container);
          }

          var wordSpans = Array.from(container.querySelectorAll('.kaamzo-word'));
          if (wordSpans.length === 0) wordSpans = [clickedSpan];

          var clickedIdx = wordSpans.indexOf(clickedSpan);
          if (clickedIdx === -1) clickedIdx = 0;

          // Target sequence to speak: starting from the clicked word
          var speakSpans = wordSpans.slice(clickedIdx);
          var rawText = speakSpans.map(function(s) { return s.textContent.trim(); }).join(' ').trim();
          if (!rawText) return;

          var lang = detectLanguage(rawText);
          var langName = lang === 'pa' ? 'Punjabi' : lang === 'hi' ? 'Hindi' : 'English';
          var statusEl = document.getElementById('kaamzo-audio-status');
          if (statusEl) {
            statusEl.textContent = 'Speaking (' + langName + '): ' + rawText.substring(0, 36) + (rawText.length > 36 ? '...' : '');
          }

          // Immediately highlight clicked word in blue
          clearActiveSpokenWord();
          clickedSpan.classList.add('kaamzo-spoken-word-active');
          activeWordSpan = clickedSpan;

          // Try native SpeechSynthesis
          if ('speechSynthesis' in window) {
            try {
              var utterance = new SpeechSynthesisUtterance(rawText);
              utterance.rate = 0.92;
              utterance.pitch = 1.0;

              var voices = window.speechSynthesis.getVoices();
              var matchedVoice = null;
              if (lang === 'pa') {
                matchedVoice = voices.find(function(v) { return v.lang.startsWith('pa') || v.name.toLowerCase().includes('punjabi'); });
                utterance.lang = 'pa-IN';
              } else if (lang === 'hi') {
                matchedVoice = voices.find(function(v) { return v.lang.startsWith('hi') || v.name.toLowerCase().includes('hindi'); });
                utterance.lang = 'hi-IN';
              } else {
                matchedVoice = voices.find(function(v) { return v.lang.startsWith('en-IN') || v.lang.startsWith('en'); });
                utterance.lang = 'en-IN';
              }
              if (matchedVoice) utterance.voice = matchedVoice;

              utterance.onboundary = function(event) {
                if (event.name === 'word' && speakSpans.length > 0) {
                  var charIndex = event.charIndex;
                  var accumulated = 0;
                  for (var i = 0; i < speakSpans.length; i++) {
                    var sLen = speakSpans[i].textContent.length;
                    if (charIndex >= accumulated && charIndex < accumulated + sLen + 2) {
                      clearActiveSpokenWord();
                      speakSpans[i].classList.add('kaamzo-spoken-word-active');
                      activeWordSpan = speakSpans[i];
                      break;
                    }
                    accumulated += sLen + 1;
                  }
                }
              };

              utterance.onend = function() {
                clearActiveSpokenWord();
                if (statusEl) statusEl.textContent = 'Finished speaking. Click any word to listen';
              };

              utterance.onerror = function() {
                fallbackGoogleTTS(rawText, lang, speakSpans);
              };

              window.speechSynthesis.speak(utterance);
              return;
            } catch(e) {
              console.warn('SpeechSynthesis error, falling back:', e);
            }
          }

          fallbackGoogleTTS(rawText, lang, speakSpans);
        }

        function fallbackGoogleTTS(text, lang, speakSpans) {
          try {
            var safeText = encodeURIComponent(text.substring(0, 180));
            var audioUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=' + lang + '&client=tw-ob&q=' + safeText;
            activeAudio = new Audio(audioUrl);
            activeAudio.play().catch(function(e) { console.warn('Audio play notice:', e); });

            if (speakSpans && speakSpans.length > 0) {
              var currentIdx = 0;
              wordInterval = setInterval(function() {
                if (!activeAudio || activeAudio.paused || currentIdx >= speakSpans.length) {
                  clearInterval(wordInterval);
                  return;
                }
                clearActiveSpokenWord();
                if (speakSpans[currentIdx]) {
                  speakSpans[currentIdx].classList.add('kaamzo-spoken-word-active');
                  activeWordSpan = speakSpans[currentIdx];
                }
                currentIdx++;
              }, 420);

              activeAudio.onended = function() {
                clearActiveSpokenWord();
                var statusEl = document.getElementById('kaamzo-audio-status');
                if (statusEl) statusEl.textContent = 'Finished speaking. Click any word to listen';
              };
            }
          } catch(e) {
            console.error('Fallback TTS failed:', e);
          }
        }

        // Global Event Delegation for clicking any word in Audio Mode
        window.addEventListener('click', function(ev) {
          if (!isAudioMode) return;
          var target = ev.target;
          if (!target) return;

          // Ignore clicks on audio toolbar controls
          if (target.closest && target.closest('.kaamzo-ui-ignore')) return;
          if (target.id === 'kaamzo-header-audio-btn' || (target.closest && target.closest('#kaamzo-header-audio-btn, .kaamzo-header-audio-btn'))) return;

          // Prevent normal click navigation when in audio listening mode
          ev.preventDefault();
          ev.stopPropagation();

          var clickedSpan = target.closest('.kaamzo-word');
          if (!clickedSpan) {
            // If target isn't tokenized yet, tokenize target
            tokenizeContainer(target);
            clickedSpan = target.querySelector('.kaamzo-word') || target;
          }

          handleWordSpeak(clickedSpan);
        }, true);
      })();
    </script>
